name: jura-agent-cloudflare

# Optional: deploy this second stack only when no existing cloudflared container
# is connected to the external web-services network.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jura-agent-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - web-services

networks:
  web-services:
    name: ${WEB_SERVICES_NETWORK:-web-services}
    external: true
